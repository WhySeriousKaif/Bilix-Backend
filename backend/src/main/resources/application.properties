spring.application.name=Bilix-pos-system


# ===============================
# SERVER
# ===============================
server.port=${PORT:5001}

# JWT Secret - Set via environment variable: JWT_SECRET
jwt.secret=${JWT_SECRET}
# ===============================
# DATABASE CONFIGURATION
# ===============================
# Local default:
#   jdbc:mysql://localhost:3306/pos_db
#   user: root
#   password: (empty) – override via env if needed
#
# In production (Railway), set SPRING_DATASOURCE_URL / USERNAME / PASSWORD
# as environment variables. These properties will pick them up automatically.

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Local H2 file-based database (Compatible with PostgreSQL syntax).
# Persists to ./data/pos_db.mv.db so data survives backend restarts — previously this
# was jdbc:h2:mem:... (in-memory only), which wiped everything on every restart.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pos_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#RazorPay Credentials
# Test-mode keys only — safe as a local default since they can't move real money.
# Before ever switching to LIVE keys: remove the inline default below and set
# RAZORPAY_API_KEY / RAZORPAY_API_SECRET as real environment variables instead.
# Never commit a live secret to this file.
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}

#Stripe
# Set these via environment variables: STRIPE_PUBLIC_KEY, STRIPE_SECRET_KEY
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.secret.key=${STRIPE_SECRET_KEY:}

# Redis Configuration (optional – used only when Redis is running)
# To use Redis: remove the line below and ensure Redis is running on localhost:6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Uncomment below when using Redis:
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.password=
# spring.data.redis.timeout=2000ms

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
