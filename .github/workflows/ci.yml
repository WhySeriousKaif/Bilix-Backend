name: Bilix CI

on:
  push:
  pull_request:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -q test
        env:
          JWT_SECRET: test-only-secret-key-that-is-long-enough-for-hmac
          RAZORPAY_API_KEY: test-key
          RAZORPAY_API_SECRET: test-secret
          STRIPE_PUBLIC_KEY: test-public-key
          STRIPE_SECRET_KEY: test-secret-key
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: test-key
          CLOUDINARY_API_SECRET: test-secret

  # Runs the same black-box API security checks an assessor would run by hand,
  # against a real backend process, on every push and pull request.
  api-security:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build backend
        working-directory: backend
        run: mvn -q -DskipTests package
      - name: Install test dependencies
        run: pip install -r security-tests/requirements.txt
      - name: Start backend
        env:
          JWT_SECRET: test-only-secret-key-that-is-long-enough-for-hmac
          APP_SEED_ENABLED: 'true'
        run: |
          java -jar backend/target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          cat backend.log
          exit 1
      - name: Run API security tests
        env:
          BILIX_TEST_PASSWORD: ${{ secrets.BILIX_TEST_PASSWORD }}
        run: pytest -q security-tests
      # DAST. Uses the same command documented in security-tests/README.md.
      # --network host is required so the scanner can reach the backend on localhost.
      # Alerts are triaged by hand, so this step reports without failing the build yet.
      - name: OWASP ZAP baseline (DAST)
        continue-on-error: true
        run: |
          mkdir -p security-tests/zap-results
          docker run --rm --network host \
            -v "$PWD/security-tests/zap-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5001/v3/api-docs \
            -J zap-report.json -r zap-report.html
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: security-tests/zap-results/
          if-no-files-found: ignore
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
