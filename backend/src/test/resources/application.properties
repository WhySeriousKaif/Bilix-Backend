# Test-only values. Production secrets must come from environment variables.
jwt.secret=test-only-secret-key-that-is-long-enough-for-hmac

# Keep the Spring context self-contained in CI. The application normally gets
# database settings from Docker/Railway environment variables; tests use H2.
spring.datasource.url=jdbc:h2:mem:bilix-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

razorpay.api.key=test-key
razorpay.api.secret=test-secret
stripe.public.key=test-public-key
stripe.secret.key=test-secret-key
cloudinary.cloud_name=test-cloud
cloudinary.api_key=test-key
cloudinary.api_secret=test-secret
