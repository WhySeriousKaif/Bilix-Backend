services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bilix}
      POSTGRES_USER: ${POSTGRES_USER:-bilix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bilix-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bilix} -d ${POSTGRES_DB:-bilix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-bilix}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bilix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bilix-local-password}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "5001:5001"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./pos-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001/api}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
