spring.application.name=Bilix-pos-system

# Render supplies PORT=10000. Local development continues to use 5001.
server.address=0.0.0.0
server.port=${PORT:5001}

# Local development uses H2. Render overrides these values with PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pos_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai.api-key=${AI_SERVICE_API_KEY:}
app.ai.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:5s}
app.ai.read-timeout=${AI_SERVICE_READ_TIMEOUT:60s}

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
razorpay.api.key=${RAZORPAY_API_KEY:test-key}
razorpay.api.secret=${RAZORPAY_API_SECRET:test-secret}
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.secret.key=${STRIPE_SECRET_KEY:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
app.cache.type=${APP_CACHE_TYPE:memory}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=bilix-refund-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.molla
app.demo-ai-data.enabled=${DEMO_AI_DATA_ENABLED:false}
# Demo users include predictable local credentials, so seeding must be explicitly enabled.
app.seed.enabled=${APP_SEED_ENABLED:false}
