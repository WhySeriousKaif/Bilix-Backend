# ===============================
# DATABASE CONFIGURATION
# ===============================
# Local default:
#   jdbc:mysql://localhost:3306/pos_db
#   user: root
#   password: (empty) – override via env if needed
#
# In production (Railway), set SPRING_DATASOURCE_URL / USERNAME / PASSWORD
# as environment variables. These properties will pick them up automatically.

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Local H2 file-based database (Compatible with PostgreSQL syntax).
# Persists to ./data/pos_db.mv.db so data survives backend restarts — previously this
# was jdbc:h2:mem:... (in-memory only), which wiped everything on every restart.
spring.datasource.url=jdbc:h2:file:./data/pos_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


